<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3F2F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Gestion commerciale : devis, factures, avoirs, bons de livraison et reçus.">
<meta name="robots" content="noindex">
<title>Comptoir</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600;800&family=Poppins:wght@600;700&display=swap">
<style>
:root{
  /* charte ZADNA.SOL.X : encre #0A0A0A, indigo #3B5BFF, teal #00C2A8, orange #FF5B3D, jaune #FFC93C.
     Les noms de variables restent ceux du gabarit NASSRA : marque = indigo, ocre = teal,
     vert = succes, brique = alerte (orange), bleu = attente (jaune). */
  --titre:"Space Grotesk",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --papier:#F3F2F2; --surface:#FFFFFF; --surface2:#EFF1F8;
  --ligne:#E4E4E4; --ligne-forte:#C7C7C7;
  --encre:#0A0A0A; --doux:#6B6B6B; --tres-doux:#8A8A8A;
  --marque:#24369E; --ocre:#00C2A8; --ivoire:#E8EDFF;
  --vert:#007A69; --vert-fond:#D9F5F0;
  --brique:#D6401F; --brique-fond:#FDEAE5;
  --bleu:#8A6200; --bleu-fond:#FFF3D4;
  --ombre:0 1px 2px rgba(10,10,10,.06), 0 8px 24px -12px rgba(10,10,10,.22);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papier:#0A0A0A; --surface:#151515; --surface2:#1D1F26;
    --ligne:#2A2A2A; --ligne-forte:#3D3D3D;
    --encre:#F3F2F2; --doux:#A8A8A8; --tres-doux:#8A8A8A;
    --marque:#8CA0FF; --ocre:#00C2A8; --ivoire:#181F3D;
    --vert:#3FDCC4; --vert-fond:#0E2A26;
    --brique:#FF8264; --brique-fond:#2E1611;
    --bleu:#FFC93C; --bleu-fond:#2E2410;
    --ombre:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --papier:#0A0A0A; --surface:#151515; --surface2:#1D1F26;
  --ligne:#2A2A2A; --ligne-forte:#3D3D3D;
  --encre:#F3F2F2; --doux:#A8A8A8; --tres-doux:#8A8A8A;
  --marque:#8CA0FF; --ocre:#00C2A8; --ivoire:#181F3D;
  --vert:#3FDCC4; --vert-fond:#0E2A26;
  --brique:#FF8264; --brique-fond:#2E1611;
  --bleu:#FFC93C; --bleu-fond:#2E2410;
  --ombre:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papier);color:var(--encre);
  font-family:var(--titre);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--ligne);padding:18px 12px;display:flex;flex-direction:column;gap:22px}
.sceau{display:flex;align-items:center;gap:10px;padding:0 4px}
.sceau .nom{font-family:var(--titre);font-weight:700;letter-spacing:.06em;color:var(--marque);font-size:15px;line-height:1}
.sceau .sous{font-size:9px;letter-spacing:.14em;color:var(--tres-doux);text-transform:uppercase;margin-top:3px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  padding:9px 10px;border-radius:8px;color:var(--doux);cursor:pointer;font-weight:500}
nav button:hover{background:var(--surface2);color:var(--encre)}
nav button[aria-current="page"]{background:var(--ivoire);color:var(--marque);font-weight:600}
nav .pastille{margin-left:auto;font-size:11px;color:var(--tres-doux);font-variant-numeric:tabular-nums}
.rail footer{margin-top:auto;font-size:11px;color:var(--tres-doux);padding:0 4px;display:flex;flex-direction:column;gap:6px}
.etat{display:inline-flex;align-items:center;gap:6px}
.etat i{width:6px;height:6px;border-radius:50%;background:var(--vert);display:block;flex:none}
.etat.local i{background:var(--ocre)}

main{padding:26px 30px 60px;max-width:1180px;margin-inline:auto;width:100%;min-width:0}
.bloc{min-width:0}
.liste{table-layout:auto}
.entete-vue{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-family:var(--titre);font-size:23px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sous-titre{color:var(--doux);margin:4px 0 0;font-size:13px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ligne-forte);background:var(--surface);
  padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--encre)}
.btn:hover{border-color:var(--ocre)}
.btn.principal{background:var(--marque);border-color:var(--marque);color:var(--surface)}
.btn.principal:hover{filter:brightness(1.1)}
.btn.discret{border-color:transparent;background:transparent;color:var(--doux);font-weight:500}
.btn.discret:hover{background:var(--surface2);color:var(--encre)}
.btn.danger{color:var(--brique);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--brique-fond)}
.btn.attente{background:var(--brique);border-color:var(--brique);color:var(--surface)}
.champ{display:flex;flex-direction:column;gap:5px}
.champ label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tres-doux);font-weight:600}
input,select,textarea{background:var(--surface);border:1px solid var(--ligne);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ocre);outline:none}
textarea{resize:vertical;min-height:64px}
.num{text-align:right;font-variant-numeric:tabular-nums}

.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:26px}
.chiffre{background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r);padding:15px 16px}
.chiffre .lib{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tres-doux);font-weight:600}
.chiffre .val{font-family:var(--titre);font-size:25px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chiffre .det{font-size:12px;color:var(--doux);margin-top:2px}
.chiffre.alerte{border-left:3px solid var(--brique)}
.chiffre.alerte .val{color:var(--brique)}
.chiffre.bien .val{color:var(--vert)}

.bloc{background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r);overflow:hidden}
.bloc + .bloc{margin-top:18px}
.bloc h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--doux);margin:0;
  padding:9px 10px 9px 16px;border-bottom:1px solid var(--ligne);font-weight:700;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.liste{width:100%;border-collapse:collapse}
.liste th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tres-doux);text-align:left;
  padding:9px 16px;border-bottom:1px solid var(--ligne);font-weight:600}
.liste td{padding:11px 16px;border-bottom:1px solid var(--ligne)}
.liste tr:last-child td{border-bottom:0}
.liste tbody tr{cursor:pointer}
.liste tbody tr:hover{background:var(--surface2)}
.liste .num{font-variant-numeric:tabular-nums;text-align:right}
.ref{font-family:var(--titre);font-weight:600;font-size:12.5px;letter-spacing:.02em}
.vide{padding:34px 18px;text-align:center;color:var(--doux)}
.vide p{margin:0 0 12px}

.puce{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;
  background:var(--surface2);color:var(--doux);white-space:nowrap}
.puce.paye{background:var(--vert-fond);color:var(--vert)}
.puce.impaye{background:var(--brique-fond);color:var(--brique)}
.puce.partiel{background:var(--bleu-fond);color:var(--bleu)}
.puce.type{background:var(--ivoire);color:var(--marque)}

.filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filtres input[type="search"]{max-width:260px}
.filtres select{width:auto}

.editeur{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:22px;align-items:start}
@media (max-width:1080px){.editeur{grid-template-columns:1fr}.cadre-apercu{position:static}}
.carte{background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r);padding:16px}
.carte + .carte{margin-top:14px}
.carte h3{margin:0 0 12px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tres-doux);font-weight:700}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
table.lignes{width:100%;border-collapse:collapse}
table.lignes th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tres-doux);
  text-align:left;padding:0 6px 6px;font-weight:600}
table.lignes td{padding:3px}
table.lignes input{padding:7px 8px}
table.lignes input.ref-rpr{margin-top:4px;padding:4px 8px;font-size:11.5px;
  font-family:var(--mono);color:var(--doux)}
.somme{display:flex;justify-content:flex-end;padding:12px 4px 0}
.somme dl{margin:0;display:grid;grid-template-columns:auto 130px;gap:6px 18px;text-align:right;align-items:center}
.somme dt{color:var(--doux)}
.somme dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.somme .total{font-family:var(--titre);font-size:17px;color:var(--marque)}
.bascule{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font:inherit;text-transform:none;
  letter-spacing:0;color:var(--encre);font-weight:600;padding:3px 9px 3px 7px;border-radius:99px;
  border:1px solid var(--ligne-forte);background:var(--surface)}
.bascule:hover{border-color:var(--ocre)}
.bascule input{width:15px;height:15px;margin:0;accent-color:var(--marque);cursor:pointer}
.bascule:has(input:checked){background:var(--ivoire);border-color:var(--marque);color:var(--marque)}
.rpr-bloc{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.rpr{font-size:12px;color:var(--doux);background:var(--surface2);border-left:3px solid var(--ligne-forte);
  padding:6px 10px;border-radius:0 6px 6px 0}
.rpr b{color:var(--encre)}
.rpr.depasse{background:var(--brique-fond);border-left-color:var(--brique);color:var(--brique)}
.rpr.depasse b{color:var(--brique)}
.barre-actions{position:sticky;bottom:0;background:var(--papier);border-top:1px solid var(--ligne);
  padding:12px 0;display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.cadre-apercu{position:sticky;top:22px}
.cadre-apercu .barre{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cadre-apercu .barre > span:first-child{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tres-doux);font-weight:600}
#bascule-apercu{display:none}
.scene{background:var(--surface2);border:1px solid var(--ligne);border-radius:var(--r);padding:14px;overflow:hidden}
.scene .porte{transform-origin:top left}

.feuille.zadna{width:210mm;min-height:297mm;background:#fff;color:#0A0A0A;padding:16mm 18mm 26mm;position:relative;
  font-family:var(--titre);font-size:10.5pt;line-height:1.5;box-shadow:0 2px 14px rgba(0,0,0,.12)}

/* en-tete : le nom a gauche, les coordonnees a droite */
.feuille.zadna .tete{display:flex;align-items:flex-start;justify-content:space-between;gap:12mm}
.feuille.zadna .coord{text-align:right;font-family:var(--mono);font-size:7.6pt;line-height:1.9;color:#6B6B6B;padding-top:1mm}
.feuille.zadna .regle{margin-top:4mm}
.feuille.zadna .regle i{display:block}
.feuille.zadna .regle .a{height:.7mm;background:#3B5BFF}
.feuille.zadna .regle .b{height:.35mm;background:#00C2A8;margin-top:.35mm}

/* bandeau date / reference */
.feuille.zadna .repere{display:flex;justify-content:space-between;gap:8mm;margin-top:6mm;
  font-family:var(--mono);font-size:8pt;letter-spacing:.12em;text-transform:uppercase;color:#8A8A8A}
.feuille.zadna .repere b{color:#0A0A0A;font-weight:500;letter-spacing:.06em}

/* titre du document a gauche, destinataire a droite */
.feuille.zadna .ouverture{display:flex;justify-content:space-between;gap:10mm;margin-top:6mm;align-items:flex-start}
.feuille.zadna .ouverture .objet{flex:1;min-width:0}
.feuille.zadna h2.type{font-size:19pt;font-weight:700;margin:0 0 3mm;letter-spacing:-.015em;line-height:1}
.feuille.zadna h2.type small{display:block;font-family:var(--mono);font-size:7.2pt;font-weight:400;
  letter-spacing:.2em;color:#3B5BFF;margin-bottom:2mm}
.feuille.zadna .objet p{margin:0;font-size:9pt;color:#6B6B6B;line-height:1.75}
.feuille.zadna .objet p b{color:#0A0A0A;font-weight:600}
.feuille.zadna .destinataire{width:72mm;flex:none;border-left:.6mm solid #3B5BFF;padding:1mm 0 1mm 4mm;
  font-size:9pt;line-height:1.65}
.feuille.zadna .destinataire strong{display:block;font-family:var(--mono);color:#8A8A8A;font-size:7.2pt;
  letter-spacing:.18em;text-transform:uppercase;margin-bottom:2mm;font-weight:500}
.feuille.zadna .destinataire .qui{font-weight:600;font-size:10pt;line-height:1.35;margin-bottom:1mm}

/* tableau : filets fins plutot qu un bandeau plein */
.feuille.zadna table.art{width:100%;border-collapse:collapse;margin-top:7mm;font-size:9.5pt}
.feuille.zadna table.art th{font-family:var(--mono);font-size:7.2pt;font-weight:500;text-align:left;color:#8A8A8A;
  letter-spacing:.16em;text-transform:uppercase;padding:0 2.6mm 2mm;border-bottom:.5mm solid #0A0A0A}
.feuille.zadna table.art th.d{text-align:right}
.feuille.zadna table.art td{border-bottom:.25mm solid #E4E4E4;padding:2.1mm 2.6mm;vertical-align:top}
.feuille.zadna table.art td.d{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--mono)}
.feuille.zadna table.art td:first-child{color:#8A8A8A;font-family:var(--mono);font-size:8.5pt}

/* totaux : le detail a droite, puis une barre pleine largeur */
.feuille.zadna .totaux{margin-top:5mm;display:flex;justify-content:flex-end}
.feuille.zadna .totaux table{border-collapse:collapse;min-width:80mm}
.feuille.zadna .totaux td{padding:1.5mm 3mm;font-size:9.5pt;color:#6B6B6B}
.feuille.zadna .totaux td.d{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
  color:#0A0A0A;font-family:var(--mono)}
.feuille.zadna .barre-net{display:flex;justify-content:space-between;align-items:baseline;gap:8mm;
  margin-top:3mm;background:#0A0A0A;color:#fff;padding:3.2mm 4mm}
.feuille.zadna .barre-net .lib{font-family:var(--mono);font-size:8pt;letter-spacing:.2em;text-transform:uppercase}
.feuille.zadna .barre-net .val{font-size:15pt;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.feuille.zadna .barre-net .val i{font-style:normal;font-size:8.5pt;font-weight:500;color:#8CA0FF;margin-left:2.5mm}

/* recu : la quittance remplace le tableau d articles */
.feuille.zadna .quittance{margin-top:7mm;border-top:.25mm solid #E4E4E4}
.feuille.zadna .quittance dl{display:grid;grid-template-columns:46mm 1fr;margin:0}
.feuille.zadna .quittance dt{font-family:var(--mono);font-size:7.2pt;letter-spacing:.16em;text-transform:uppercase;
  color:#8A8A8A;padding:2.5mm 0;border-bottom:.25mm solid #E4E4E4}
.feuille.zadna .quittance dd{margin:0;font-size:10pt;padding:2.5mm 0;border-bottom:.25mm solid #E4E4E4}
.feuille.zadna .quittance dd b{font-weight:600}
.feuille.zadna .quittance .du{color:#D6401F;font-weight:600;font-family:var(--mono)}

/* bon de livraison : la colonne que le client remplit a la reception */
.feuille.zadna table.art td.remplir{background:#F4F6FF;border-bottom:.25mm solid #B9C4F2}
.feuille.zadna .recu-par{font-size:9pt;line-height:2.5}
.feuille.zadna .recu-par i{display:inline-block;border-bottom:.25mm dotted #8A8A8A;min-width:36mm;font-style:normal}
.feuille.zadna .paraphes .compact b{margin-bottom:5mm}

.feuille.zadna .lettres{margin-top:5mm;font-size:9.5pt;border-left:.6mm solid #00C2A8;padding-left:4mm}
.feuille.zadna .notes{margin-top:4mm;font-size:8.5pt;color:#6B6B6B;white-space:pre-wrap}

/* bande de certification e-MECeF : ce qui fait la facture normalisee */
.feuille.zadna .certif{margin-top:6mm;border:.3mm solid #B9C4F2;background:#F7F9FF;
  display:flex;gap:4mm;align-items:center;padding:3mm 3.5mm}
.feuille.zadna .certif .qr{flex:none;width:21mm;height:21mm;background:#fff}
.feuille.zadna .certif .qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.feuille.zadna .certif .corps{flex:1;min-width:0}
.feuille.zadna .certif .titre{font-family:var(--mono);font-size:6.6pt;letter-spacing:.18em;
  text-transform:uppercase;color:#3B5BFF;margin-bottom:1.6mm}
.feuille.zadna .certif dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1mm 4mm;
  font-family:var(--mono);font-size:7.4pt;line-height:1.35}
.feuille.zadna .certif dt{color:#8A8A8A;letter-spacing:.09em;text-transform:uppercase;font-size:6.4pt;
  align-self:center;white-space:nowrap}
.feuille.zadna .certif dd{margin:0;font-weight:500;word-break:break-all;font-variant-numeric:tabular-nums}

/* paraphes : le client a gauche, ZADNA et son cachet a droite */
.feuille.zadna .paraphes{display:flex;justify-content:flex-end;gap:12mm;margin-top:10mm;font-size:9pt;color:#6B6B6B}
/* le bloc du client, quand il existe, repousse la signature à droite */
.feuille.zadna .paraphes > div:not(.sig-d){margin-right:auto}
.feuille.zadna .paraphes > div{width:70mm}
.feuille.zadna .paraphes b{display:block;color:#0A0A0A;font-family:var(--mono);font-size:7.6pt;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:16mm}
.feuille.zadna .sig-d{position:relative;text-align:right;min-height:34mm}
.feuille.zadna .sig-d .qui{color:#0A0A0A;font-weight:600}
.feuille.zadna .cachet{position:absolute;left:0;top:2mm;width:32mm;height:32mm;transform:rotate(-6deg);
  opacity:.9;pointer-events:none}

/* pied : double filet inverse, puis les mentions sur trois colonnes */
.feuille.zadna .pied{position:absolute;left:18mm;right:18mm;bottom:11mm}
.feuille.zadna .pied .regle{margin-top:0}
.feuille.zadna .pied .regle .a{height:.35mm;background:#00C2A8}
.feuille.zadna .pied .regle .b{height:.7mm;background:#3B5BFF;margin-top:.35mm}
.feuille.zadna .pied .mentions{display:flex;justify-content:space-between;align-items:center;gap:6mm;margin-top:2.5mm;
  font-family:var(--mono);font-size:6.6pt;letter-spacing:.03em;color:#8A8A8A;line-height:1.75}
.feuille.zadna .pied .mentions b{color:#0A0A0A;font-weight:600}
.feuille.zadna .pied .mentions .droite{text-align:right}
.feuille.zadna .pied .sceau-pale{font-family:var(--titre);font-size:12pt;font-weight:700;color:#0A0A0A;opacity:.09;flex:none}

/* ---------- la feuille NASSRA ----------

  /* Le navigateur n imprime pas les fonds par defaut. Nos totaux sont en

  .feuille,.feuille *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

  .feuille table.art thead{display:table-header-group}

};

};
/* Referentiels e-MECeF (DGI Benin). Groupes : formulaire officiel d auto-declaration de SFE. */
var TYPES_MECEF = [["FV","Facture de vente"],["FA","Facture d'avoir"],
                   ["EV","Facture de vente à l'exportation"],["EA","Facture d'avoir à l'exportation"]];
var GROUPES = [["A","EXO","Exonéré"],["B","TAX","Taxable"],["C","EXP","Exportation de produits taxables"],
               ["D","MP","TVA régime d'exception"],["E","TPS","Régime fiscal TPS"],["F","RES","Réservé"]];
function libelleGroupe(g){
  for(var i = 0; i < GROUPES.length; i++) if(GROUPES[i][0] === g) return GROUPES[i][1];
  return g || "";
}
/* le QR est dessine dans la page : la DGI fournit son contenu, pas son image */
/* la facture et son avoir sont les deux pieces que la DGI certifie */
function estCertifiable(d){ return d.type === "facture" || d.type === "avoir"; }
function qrDataURL(valeur, taille){
  if(!valeur || typeof QRious !== "function") return "";
  try {
    return new QRious({value:String(valeur), size:taille || 240, level:"M", padding:0}).toDataURL("image/png");
  } catch(e){ return ""; }
}
var COLS = ["clients","articles","documents","reglages"];
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function auj(){ return new Date().toISOString().slice(0,10); }
function nombre(n){ return Math.round(Number(n)||0).toLocaleString("fr-FR").replace(/[  ]/g," "); }
function fcfa(n){ return nombre(n) + " F CFA"; }
function dateFr(s){ if(!s) return "…"; var p = String(s).split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function echap(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

/* montant en toutes lettres */
var U = ["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize",
         "quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
var D = ["","","vingt","trente","quarante","cinquante","soixante"];
function deuxChiffres(x){
  if(x < 20) return U[x];
  var t = Math.floor(x/10), r = x % 10;
  if(t <= 6) return D[t] + (r === 0 ? "" : (r === 1 ? "-et-un" : "-" + U[r]));
  if(t === 7) return "soixante" + (r === 1 ? "-et-onze" : "-" + U[10+r]);
  if(t === 8) return "quatre-vingt" + (r === 0 ? "s" : "-" + U[r]);
  return "quatre-vingt-" + U[10+r];
}
function troisChiffres(x){
  var c = Math.floor(x/100), r = x % 100, s = "";
  if(c > 0) s += (c > 1 ? U[c] + " " : "") + "cent" + (c > 1 && r === 0 ? "s" : "");
  if(r > 0) s += (s ? " " : "") + deuxChiffres(r);
  return s;

function enLettres(n){
  n = Math.round(Math.abs(Number(n) || 0));
  if(n === 0) return "zéro";
  var reste = n, out = "";
  [[1e9,"milliard"],[1e6,"million"],[1e3,"mille"]].forEach(function(e){

    if(q > 0){

         mais s'accordent devant million et milliard, qui sont des noms */
      if(e[1] === "mille") out += (out ? " " : "") +
        (q > 1 ? troisChiffres(q).replace(/(cent|vingt)s$/, "$1") + " " : "") + "mille";
      else out += (out ? " " : "") + troisChiffres(q) + " " + e[1] + (q > 1 ? "s" : "");
    }
  });
  if(reste > 0) out += (out ? " " : "") + troisChiffres(reste);
  return out;
}

/* ======================= stockage ======================= */
/* Les pièces vivent dans Supabase : une ligne par document, cloisonnée par
   comptoir, le corps en jsonb. Le repli localStorage n'est pas un cache de
   confort — c'est ce qui permet de continuer à facturer quand le réseau
   tombe, ce qui arrive. La synchronisation reprend d'elle-même au retour. */
var SB_URL = "https://pfofqxhrtzydarlipcqy.supabase.co";
var SB_CLE = "sb_publishable_dGxuOKpKi8p5F81oQ6k_Ew_62s8Di19";
var sb = null;

/* la table reglages est indexée par « cle », les autres par « id » */
function cleDe(col){ return col === "reglages" ? "cle" : "id"; }

var Store = {
  mode:"local", data:{}, comptoir:null, canaux:[],

  boite:function(col){ return "comptoir:" + (this.comptoir || "?") + ":" + col; },
  lireLocal:function(col){
    try { return JSON.parse(localStorage.getItem(this.boite(col)) || "[]"); }
    catch(e){ return []; }
  },
  ecrireLocal:function(col){
    try { localStorage.setItem(this.boite(col), JSON.stringify(this.data[col])); } catch(e){}
  },

  init:function(comptoir){
    var self = this;
    self.comptoir = comptoir;
    COLS.forEach(function(c){ self.data[c] = self.lireLocal(c); });
    rendre(true);
    return self.charger().then(function(){ self.ecouter(); });
  },

  charger:function(col){
    var self = this;
    var cibles = col ? [col] : COLS;
    return Promise.all(cibles.map(function(c){
      /* L'API borne le nombre de lignes rendues (mille par défaut). Sans
         pagination, un catalogue volumineux serait tronqué EN SILENCE : pas
         d'erreur, juste des articles absents. */
      return (function page(de, acc){
        return sb.from(c).select("*").eq("comptoir", self.comptoir)
          .order(cleDe(c)).range(de, de + 999).then(function(r){
            if(r.error) throw r.error;
            var lot = r.data || [];
            acc = acc.concat(lot);
            return lot.length < 1000 ? acc : page(de + 1000, acc);
          });
      })(0, []).then(function(tout){
        self.data[c] = tout.map(function(ligne){
          var o = Object.assign({}, ligne.donnees || {});
          o.id = ligne[cleDe(c)];
          return o;
        });
        self.ecrireLocal(c);
      });
    })).then(function(){
      self.mode = "partage";
      rendre(); majEtat();
      /* le nom du rail vient des réglages, qui n existent qu une fois chargés :
         la charte posée à l ouverture affichait encore celui du gabarit */
      appliquerCharte(charteCourante);
    }).catch(function(e){
      console.warn("chargement", e && e.message);
      self.mode = "local";
      rendre(); majEtat();
    });
  },

  /* Chaque table est écoutée séparément et ne recharge qu'elle-même :
     recharger les quatre à chaque frappe d'un autre appareil serait inutile. */
  ecouter:function(){
    var self = this;
    self.canaux.forEach(function(c){ try { sb.removeChannel(c); } catch(e){} });
    self.canaux = COLS.map(function(col){
      return sb.channel("maj-" + col + "-" + self.comptoir)
        .on("postgres_changes",
            {event:"*", schema:"public", table:col, filter:"comptoir=eq." + self.comptoir},
            function(){ self.charger(col); })
        .subscribe();
    });
  },

  tout:function(col){ return this.data[col] || []; },
  un:function(col, id){
    var l = this.tout(col);
    for(var i = 0; i < l.length; i++) if(l[i].id === id) return l[i];
    return null;
  },

  poser:function(col, obj){
    var self = this;
    if(!obj.id) obj.id = uid();
    var i = -1, l = this.data[col];
    for(var k = 0; k < l.length; k++) if(l[k].id === obj.id) i = k;
    if(i >= 0) l[i] = obj; else l.push(obj);
    rendre();
    this.ecrireLocal(col);

    var corps = Object.assign({}, obj); delete corps.id;
    var ligne = {comptoir:self.comptoir, donnees:corps};
    ligne[cleDe(col)] = obj.id;
    return sb.from(col).upsert(ligne, {onConflict:"comptoir," + cleDe(col)}).then(function(r){
      if(r.error){
        self.mode = "local"; majEtat();
        signal("Hors ligne — enregistré sur cet appareil");
      } else if(self.mode !== "partage"){
        self.mode = "partage"; majEtat();
      }
    });
  },

  retirer:function(col, id){
    var self = this;
    this.data[col] = this.data[col].filter(function(x){ return x.id !== id; });
    rendre();
    this.ecrireLocal(col);
    var q = sb.from(col).delete().eq("comptoir", self.comptoir);
    return q.eq(cleDe(col), id).then(function(r){
      if(r.error){ self.mode = "local"; majEtat(); signal("Suppression non synchronisée"); }
    });
  },

  /* Renvoie vers Supabase tout ce qui a été saisi hors ligne. */
  resynchroniser:function(){
    var self = this;
    if(!sb || !self.comptoir) return Promise.resolve();
    var envois = [];
    COLS.forEach(function(col){
      self.data[col].forEach(function(obj){
        var corps = Object.assign({}, obj); delete corps.id;
        var ligne = {comptoir:self.comptoir, donnees:corps};
        ligne[cleDe(col)] = obj.id;
        envois.push(sb.from(col).upsert(ligne, {onConflict:"comptoir," + cleDe(col)}));
      });
    });
    return Promise.all(envois).then(function(){
      signal("Synchronisé");
      return self.charger();
    }).catch(function(){ signal("Synchronisation impossible"); });
  }
};

/* ======================= calculs ======================= */
function totalLignes(d){
  return (d.lignes || []).reduce(function(s,l){ return s + (Number(l.q)||0) * prixLigne(d,l); }, 0);
}
function tauxTva(d){
  if(!d || !d.tva) return 0;
  return Number(d.tauxTva) || Number(reglages().tauxTva) || 18;
}
function baseDoc(d){ return Math.max(0, totalLignes(d) - (Number(d.remise)||0)); }
/* En saisie TTC, le total des lignes EST un TTC : le hors taxe s'en dégage au
   total, et la TVA est ce qui reste. Dégager ligne à ligne aurait décalé la
   somme de la colonne du total imprimé, d'un franc ou deux — visible sur le
   papier, et indéfendable devant un acheteur qui refait l'addition. */
function montantHT(d){
  var b = baseDoc(d);
  return (d && d.saisieTTC) ? htDepuisTTC(b, tauxTva(d)) : b;
}

/* Le Répertoire de l'État publie ses bornes en TTC. Quand on facture à ce
   prix-là, c'est le TTC qui est arrêté : le hors taxe et la TVA s'en dégagent,
   au lieu de s'ajouter par-dessus. Le prix unitaire reste stocké en HT dans
   toute l'application — une seule unité, aucun document ne peut se tromper
   sur ce qu'il imprime ; seule la saisie bascule. L'arrondi du HT va vers le
   bas pour que le TTC reconstitué ne franchisse jamais le plafond. */
/* Le hors taxe le plus proche, et la TVA est ce qui reste. Sur environ un
   montant sur sept, aucun entier ne redonne exactement le TTC une fois la TVA
   arrondie : la TVA imprimée s'écarte alors d'un franc du taux exact. C'est le
   sens dans lequel il faut céder — sur une facture, l'addition de la colonne
   doit tomber juste, un acheteur la refait. */
function htDepuisTTC(ttc, tx){
  var T = Math.round(Number(ttc)||0);
  if(T <= 0) return 0;
  return Math.round(T / (1 + (Number(tx)||0) / 100));
}
function ttcDepuisHT(pu, tx){ return Math.round((Number(pu)||0) * (1 + (Number(tx)||0) / 100)); }
function puAffiche(d, l){
  if(!d.saisieTTC) return l.pu;
  return (l.ttc === undefined || l.ttc === null) ? ttcDepuisHT(l.pu, tauxTva(d)) : l.ttc;
}
/* Le prix d'une ligne dans l'unité où le document est tenu : en saisie TTC,
   c'est le prix payé qui fait foi — celui qu'on a tapé, celui qui figure au
   Répertoire, celui qui s'imprime. */
function prixLigne(d, l){ return Number(puAffiche(d, l)) || 0; }

/* Le TTC est l'ancre : si la TVA change, c'est le HT qui bouge, pas le prix payé. */
function recalerLignesTTC(d){
  if(!d || !d.saisieTTC) return;
  var tx = tauxTva(d);
  (d.lignes || []).forEach(function(l){
    if(l.ttc === "" ) { l.pu = ""; return; }
    if(l.ttc !== undefined && l.ttc !== null) l.pu = htDepuisTTC(l.ttc, tx);
  });
}
function montantTVA(d){
  return (d && d.saisieTTC) ? baseDoc(d) - montantHT(d) : Math.round(montantHT(d) * tauxTva(d) / 100);
}
/* AIB : acompte sur impôt assis sur les bénéfices, collecté en sus par le vendeur */
function tauxAib(d){ return Number(d && d.aib) || 0; }
function montantAIB(d){ return Math.round(montantHT(d) * tauxAib(d) / 100); }
function netAPayer(d){ return montantHT(d) + montantTVA(d) + montantAIB(d); }
function resteDu(d){ return Math.max(0, netAPayer(d) - (Number(d.regle)||0)); }
function statutDoc(d){
  var T = TYPES[d.type] || {};
  if(d.statut === "brouillon") return {cle:"", libelle:"Brouillon"};
  if(d.statut === "annule")    return {cle:"", libelle:"Annulé"};
  if(!T.reglement)             return {cle:"", libelle:"Établi"};
  if(resteDu(d) === 0 && netAPayer(d) > 0) return {cle:"paye", libelle:"Payé"};
  if((Number(d.regle)||0) > 0)             return {cle:"partiel", libelle:"Partiel"};
  return {cle:"impaye", libelle:"Impayé"};
}
function prochainNumero(type){
  var an = new Date().getFullYear();
  var seq = Store.tout("documents").filter(function(d){ return d.type === type && d.annee === an; })
    .reduce(function(m,d){ return Math.max(m, d.seq || 0); }, 0) + 1;
  return {seq:seq, annee:an, numero: TYPES[type].code + "-" + an + "-" + String(seq).padStart(3,"0")};
}

function vueBord(){
  var docs = Store.tout("documents");
  var mois = new Date().toISOString().slice(0,7);
  var factures = docs.filter(function(d){
    return d.type === "facture" && d.statut !== "annule" && d.statut !== "brouillon";
  });
  var duMois = factures.filter(function(d){ return (d.date||"").slice(0,7) === mois; });
  /* un avoir annule du chiffre d affaires : il se retranche du facturé */
  var avoirsMois = docs.filter(function(d){
    return d.type === "avoir" && d.statut !== "annule" && d.statut !== "brouillon" &&
           (d.date||"").slice(0,7) === mois;
  });
  var facture = duMois.reduce(function(s,d){ return s + netAPayer(d); }, 0) -
                avoirsMois.reduce(function(s,d){ return s + netAPayer(d); }, 0);
  var encaisse = duMois.reduce(function(s,d){ return s + Math.min(netAPayer(d), Number(d.regle)||0); }, 0);
  var impayes = factures.reduce(function(s,d){ return s + resteDu(d); }, 0);
  var devisOuverts = docs.filter(function(d){ return d.type === "devis" && d.statut !== "annule"; }).length;
  var retard = factures.filter(function(d){ return resteDu(d) > 0 && d.echeance && d.echeance < auj(); })
    .sort(function(a,b){ return a.echeance.localeCompare(b.echeance); });
  var recents = docs.slice().sort(function(a,b){
    return (b.date||"").localeCompare(a.date||"") || (b.seq||0) - (a.seq||0);
  }).slice(0,7);

  return '<div class="entete-vue"><div><h1>Où en est ' + echap(reglages().nom) + ' aujourd\'hui</h1><p class="sous-titre">' +

    '<div class="chiffres">' +

      chiffre("Encaissé ce mois", fcfa(encaisse), facture ? Math.round(encaisse/facture*100) + " % du facturé" : "—", "bien") +
      chiffre("Reste à encaisser", fcfa(impayes), retard.length ? retard.length + " facture(s) en retard" : "aucun retard",
              impayes > 0 ? "alerte" : "") +
      chiffre("Devis en cours", String(devisOuverts), "à relancer ou convertir", "") +
    "</div>" +
    (retard.length ? '<div class="bloc"><h2>En retard de paiement</h2>' + tableauDocs(retard) + "</div>" : "") +
    '<div class="bloc"><h2>Derniers documents<button class="btn discret" data-vue="documents">Tout voir</button></h2>' +

/* ---------- catalogue ---------- */
function famillesConnues(){
  var vues = {}, l = [];
  Store.tout("articles").forEach(function(a){
    if(a.famille && !vues[a.famille]){ vues[a.famille] = 1; l.push(a.famille); }
  });
  return l.sort();
}
function vueCatalogue(){
  var tous = Store.tout("articles").slice().sort(function(a,b){ return (a.d||"").localeCompare(b.d||""); });
  var arts = tous;
  if(filtreCat.source === "mien") arts = arts.filter(function(a){ return !a.ref; });
  /* Le Répertoire ne vit plus dans le catalogue : il se cherche, plus bas. */
  if(filtreCat.famille) arts = arts.filter(function(a){ return a.famille === filtreCat.famille; });
  if(filtreCat.texte){
    var q = filtreCat.texte.toLowerCase();
    arts = arts.filter(function(a){ return (a.d||"").toLowerCase().indexOf(q) >= 0; });
  }
  var trop = arts.length > 150;
  var vis = trop ? arts.slice(0,150) : arts;
  var corps = vis.map(function(a){
    var enAttente = aConfirmer === "articles:" + a.id;
    return '<tr data-modif="articles:' + a.id + '"><td>' + echap(a.d) +
      (a.famille || a.code ? '<div style="color:var(--tres-doux);font-size:11.5px">' +
        echap(a.famille || "") + (a.famille && a.code ? "  ·  " : "") +
        (a.code ? "Réf. " + echap(a.code) : "") + "</div>" : "") + "</td>" +
      '<td data-lib="Unité">' + echap(a.u || "—") + "</td>" +
      '<td class="num" data-lib="Mon prix">' + (Number(a.pu) ? nombre(a.pu) : '<span style="color:var(--tres-doux)">à fixer</span>') + "</td>" +
      '<td class="num" data-lib="Répertoire">' + (a.bs ? nombre(a.bi) + " – " + nombre(a.bs) : "—") + "</td>" +
      '<td class="act"><button class="btn ' + (enAttente ? "attente" : "danger") + '" data-suppr="articles:' + a.id + '">' +
      (enAttente ? "Confirmer" : "Supprimer") + "</button></td></tr>";
  }).join("");
  var fams = famillesConnues();
  return '<div class="entete-vue"><div><h1>Catalogue</h1>' +
    '<p class="sous-titre">Vos articles. Le Répertoire de l\'État se cherche dans la carte du bas.</p></div>' +

    '<input type="search" id="c-texte" placeholder="Rechercher un article…" value="' + echap(filtreCat.texte) + '">' +
    '<select id="c-source"><option value="">Tout le catalogue</option>' +
      '<option value="mien"' + (filtreCat.source === "mien" ? " selected" : "") + ">Mes articles</option>" +
      "</select>" +
    (fams.length ? '<select id="c-famille"><option value="">Toutes les familles</option>' +
      fams.map(function(f){
        return '<option value="' + echap(f) + '"' + (filtreCat.famille === f ? " selected" : "") + ">" + echap(f) + "</option>";
      }).join("") + "</select>" : "") +
    '<span style="color:var(--doux);font-size:12px">' + arts.length + " article" + (arts.length > 1 ? "s" : "") +
    (trop ? " · 150 affichés" : "") + "</span></div>" +
    '<div class="bloc">' + (arts.length ?
      '<table class="liste"><thead><tr><th>Désignation</th><th>Unité</th><th class="num">Mon prix</th>' +
      '<th class="num">Répertoire (TTC)</th><th></th></tr></thead><tbody>' + corps + "</tbody></table>" :
      '<div class="vide"><p>Aucun article ne correspond.</p><button class="btn principal" data-form-neuf="articles">Ajouter un article</button></div>') +
    "</div>" +
    '<div class="carte" style="margin-top:18px"><h3>Répertoire des Prix de Référence de l\'État</h3>' +
    '<p style="color:var(--doux);margin:0 0 10px;font-size:12.5px">Dix mille articles : ils ne sont pas chargés dans ' +
    "l'application, ils s'y cherchent. Les fourchettes sont des prix TTC.</p>" +

}

    typeMecef: type === "avoir" ? "FA" : "FV", aib:"0",
    cert:{nim:"",code:"",compteurs:"",date:"",qr:""},

  vue = "editeur"; aConfirmer = null; rendre(true);

function ouvrirDoc(id){
  var d = Store.un("documents", id);
  if(!d) return;
  brouillon = JSON.parse(JSON.stringify(d));
  if(!brouillon.client) brouillon.client = {nom:"",adresse:"",ifu:"",tel:""};
  if(!brouillon.lignes || !brouillon.lignes.length) brouillon.lignes = [{d:"",q:1,pu:0}];
  vue = "editeur"; aConfirmer = null; rendre(true);
}
function convertir(type){
  var src = brouillon, n = prochainNumero(type);
  brouillon = Object.assign({}, JSON.parse(JSON.stringify(src)), {
    id:null, type:type, seq:n.seq, annee:n.annee, numero:n.numero, date:auj(),
    statut:"brouillon", regle:0, source:src.numero,
    /* la nouvelle pièce n est pas certifiée : elle ne peut pas porter le code de l ancienne */
    cert:{nim:"",code:"",compteurs:"",date:"",qr:""},
    typeMecef: type === "avoir" ? "FA" : "FV",
    echeance: TYPES[type].reglement ? new Date(Date.now() + 30*864e5).toISOString().slice(0,10) : ""
  });
  rendre(true);
  signal("Converti en " + TYPES[type].court.toLowerCase() + " " + brouillon.numero + " — reste à enregistrer");
}

/* ---------- la lettre ----------
   Un courrier n'est pas un tableau : il reprend l'en-tête et le pied de la
   maquette du comptoir, et rien d'autre. */
function enteteLettre(r, d, maquette){
  if(maquette === "nassra"){
    return '<div class="marque-bloc">' +
      '<svg viewBox="0 0 300 110" width="185" height="68" role="img" aria-label="' + echap(r.nom) + '">' +
      '<path d="M22 74 V44 a38 38 0 0 1 76 0 v30 h-13 V44 a25 25 0 0 0 -50 0 v30 z" fill="#5A2E1E"/>' +
      '<rect x="22" y="80" width="76" height="7" rx="3.5" fill="#C98A3C"/>' +
      '<text x="118" y="58" font-family="Poppins,sans-serif" font-size="27" font-weight="700" letter-spacing="4" fill="#5A2E1E">' + echap(r.nom) + "</text>" +
      '<text x="120" y="76" font-family="Poppins,sans-serif" font-size="7.5" letter-spacing="1.3" fill="#8A7F73">' + echap(r.activite) + "</text></svg>" +
      '<div class="meta">' + echap(r.adresse).replace(/ \u2014 /g, "<br>") + "<br>" +
      echap(r.tel) + "<br>" + echap(r.email) + "</div></div>" +
      '<div class="filet"><i class="a"></i><i class="b"></i></div>';
  }
  return '<div class="tete">' + marqueSVG(r) +
    '<div class="coord">' + echap(r.adresse).replace(/ \u2014 /g, "<br>") + "<br>" +
    echap(r.tel) + "<br>" + echap(r.email) + "</div></div>" +
    '<div class="regle"><i class="a"></i><i class="b"></i></div>';
}

function piedLettre(r, maquette){
  if(maquette === "nassra"){
    return '<div class="pied"><b>' + echap(r.nom) + "</b> \u2014 " + echap(r.forme || "") +
      "<br>RCCM : " + echap(r.rccm) + "  \u00b7  IFU : " + echap(r.ifu) +
      "  \u00b7  T\u00e9l. : " + echap(r.tel) + "  \u00b7  " + echap(r.email) + "<br>" +
      echap(r.adresse) + "</div>";
  }
  return '<div class="pied"><div class="regle"><i class="a"></i><i class="b"></i></div>' +
    '<div class="mentions"><span><b>' + echap(r.forme || r.nom) + "</b><br>RCCM : " + echap(r.rccm) +
    "  \u00b7  IFU : " + echap(r.ifu) + "</span>" +
    '<span class="sceau-pale">&lt;ZSX/&gt;</span>' +
    '<span class="droite">' + echap(r.tel) + "<br>" + echap(r.email) + "</span></div></div>";
}

function feuilleCourrier(d){
  var r = reglages(), cli = d.client || {}, m = maquetteCourante();
  /* La ville d'émission est un réglage. La deviner en coupant l'adresse à
     la première virgule donnait « Parcelle f, le 11 septembre ». */
  var lieu = (d.lieu || "").trim() || (r.ville || "").trim();
  var dateLongue = d.date
    ? new Date(d.date + "T12:00:00").toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"})
    : "";

  /* Une ligne vide sépare deux paragraphes : c'est la convention que tout le
     monde applique en tapant, autant la respecter plutôt que l'expliquer. */
  var corps = String(d.corps || "").split(/\n\s*\n/).filter(function(p){ return p.trim(); })
    .map(function(p){ return "<p>" + echap(p.trim()).replace(/\n/g, "<br>") + "</p>"; }).join("");
  if(!corps) corps = "<p>\u2026</p>";

  var appel = (d.appel || "").trim();
  var politesse = String(d.politesse || "").replace("{appel}", appel || "Monsieur,");

  var refs = [];
  if(d.refVotre) refs.push("<b>V/R\u00e9f.</b> " + echap(d.refVotre));
  refs.push("<b>N/R\u00e9f.</b> " + echap(d.numero));

  var annexes = [];
  if(d.pj) annexes.push("<b>P.J. :</b> " + echap(d.pj));
  if(d.copie) annexes.push("<b>Copie \u00e0 :</b> " + echap(d.copie));

  var signature = m === "nassra"
    ? '<div class="paraphes"><div class="sig-g">' + (d.cachet !== false ? cachetNassra(r) : "") +
      "<b>Pour " + echap(r.nom) + "</b>" + echap(r.signataire) + "<br>" + echap(r.fonction) + "</div></div>"
    : '<div class="paraphes"><div class="sig-d">' + (d.cachet !== false ? cachetSVG(r) : "") +
      "<b>Pour " + echap(r.nom) + "</b>" +
      '<span class="qui">' + echap(r.signataire) + "</span><br>" + echap(r.fonction) + "</div></div>";

  return '<div class="feuille ' + m + '">' + enteteLettre(r, d, m) +
    '<div class="courrier">' +
    '<div class="lieu-date">' + echap(lieu) + ", le " + dateLongue + "</div>" +
    '<div class="destinataire-lettre">' +
    '<div class="qui">' + echap(cli.nom || "\u2026") + "</div>" +
    (d.destFonction ? "\u00c0 l\u2019attention de " + echap(d.destFonction) + "<br>" : "") +
    echap(cli.adresse || "") + "</div>" +
    '<div class="refs">' + refs.join("<br>") + "</div>" +
    (d.objet ? '<div class="objet"><b>Objet :</b> ' + echap(d.objet) + "</div>" : "") +
    (appel ? '<div class="appel">' + echap(appel) + "</div>" : "") +
    '<div class="corps">' + corps + "</div>" +
    (politesse ? '<div class="politesse">' + echap(politesse) + "</div>" : "") +
    "</div>" + signature +
    (annexes.length ? '<div class="courrier"><div class="annexes">' + annexes.join("<br>") + "</div></div>" : "") +
    piedLettre(r, m) + "</div>";
}
