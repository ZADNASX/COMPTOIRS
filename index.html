function bandeCertif(d){
  if(!estCertifiable(d)) return "";
  var c = d.cert || {};
  if(!c.code && !c.nim && !c.qr) return "";
  var img = qrDataURL(c.qr, 240), elts = [];
  if(c.nim) elts.push(["NIM", echap(c.nim)]);
  if(c.code) elts.push(["Code MECeF", echap(c.code)]);
  if(c.compteurs) elts.push(["Compteurs", echap(c.compteurs)]);
  if(c.date) elts.push(["Certifiée le", echap(c.date)]);
  return '<div class="certif">' +
    (img ? '<div class="qr"><img src="' + img + '" alt="QR de vérification e-MECeF"></div>' : "") +
    '<div class="corps"><div class="titre">Facture normalisée · ' +
    echap(d.typeMecef || "FV") + ' · e-MECeF</div><dl>' +
    elts.map(function(x){ return "<dt>" + x[0] + "</dt><dd>" + x[1] + "</dd>"; }).join("") +
    "</dl></div></div>";
}

function feuilleNassra(d){
  var T = TYPES[d.type], r = reglages(), cli = d.client || {};
  var net = netAPayer(d), brut = totalLignes(d), reste = resteDu(d);
  var certifiable = estCertifiable(d);
  var cert = d.cert || {};
  var grpDefaut = r.groupeDefaut || "E";

  var gauche = [];
  gauche.push("<strong>" + (d.objet ? "Objet" : "Références") + "</strong>");
  if(d.objet) gauche.push(echap(d.objet));
  if(d.source) gauche.push((T.avoir ? "Avoir sur la facture " : "Établi d'après ") + echap(d.source));
  if(T.validite) gauche.push("Validité de l'offre : " + echap(r.validite));
  if(T.reglement && d.echeance) gauche.push("Échéance : " + dateFr(d.echeance));
  if(!d.objet && !d.source && !T.validite && !d.echeance) gauche.push("…");

  var colGr = certifiable ? '<th class="d" style="width:11mm">Gr.</th>' : "";
  var cols = T.prix
    ? '<th style="width:8mm">N°</th><th>Désignation</th><th class="d" style="width:16mm">Qté</th>' +
      '<th class="d" style="width:26mm">P.U.' + (d.saisieTTC ? " TTC" : "") + '</th>' +
      '<th class="d" style="width:30mm">Montant' + (d.saisieTTC ? " TTC" : "") + "</th>" + colGr
    : '<th style="width:8mm">N°</th><th>Désignation</th><th class="d" style="width:26mm">Qté commandée</th>' +
      '<th class="d" style="width:26mm">Qté livrée</th>';

  var utiles = (d.lignes||[]).filter(function(l){
    return String(l.d||"").trim() || Number(l.q) || Number(l.pu) || Number(l.ttc);
  });
  if(!utiles.length) utiles = [{d:"…", q:"", pu:0}];
  var corps = utiles.map(function(l,i){
    return "<tr><td>" + (i+1) + "</td><td>" + echap(l.d) +
      (l.code ? '<span style="display:block;font-size:8pt;color:#6b6b6b;letter-spacing:.02em">Réf. ' + echap(l.code) + "</span>" : "") +
      '</td><td class="d">' + echap(l.q) + "</td>" +
      (T.prix ? '<td class="d">' + nombre(prixLigne(d,l)) + '</td><td class="d">' + nombre((Number(l.q)||0) * prixLigne(d,l)) + "</td>"
              : '<td class="d"></td>') +
      (certifiable ? '<td class="d">' + echap(l.g || grpDefaut) + "</td>" : "") + "</tr>";
  }).join("");

  var totaux = "";
  if(T.prix){
    var tx = tauxTva(d);
    totaux = '<div class="totaux"><table>' +
      (Number(d.remise) ? "<tr><td>Sous-total" + (d.saisieTTC ? " TTC" : "") + '</td><td class="d">' + nombre(brut) + "</td></tr>" +
        '<tr><td>Remise</td><td class="d">− ' + nombre(d.remise) + "</td></tr>" : "") +
      (tx ? (d.saisieTTC
              ? '<tr><td>Montant TTC</td><td class="d">' + nombre(montantHT(d) + montantTVA(d)) + "</td></tr>" +
                '<tr><td>dont TVA ' + tx + ' %</td><td class="d">' + nombre(montantTVA(d)) + "</td></tr>" +
                '<tr><td>Montant HT</td><td class="d">' + nombre(montantHT(d)) + "</td></tr>"
              : '<tr><td>Montant HT</td><td class="d">' + nombre(montantHT(d)) + "</td></tr>" +
                '<tr><td>TVA ' + tx + ' %</td><td class="d">' + nombre(montantTVA(d)) + "</td></tr>")
          : (tauxAib(d) ? '<tr><td>Montant HT</td><td class="d">' + nombre(montantHT(d)) + "</td></tr>" : "")) +
      (tauxAib(d) ? '<tr><td>AIB ' + tauxAib(d) + ' %</td><td class="d">' + nombre(montantAIB(d)) + "</td></tr>" : "") +
      '<tr class="net"><td>' + (T.avoir ? "MONTANT DE L'AVOIR" : T.recu ? "MONTANT REÇU" : "NET À PAYER" + (tx ? " TTC" : "")) + ' (F CFA)</td><td class="d">' +
      nombre(T.recu ? (Number(d.regle) || net) : net) + "</td></tr>" +
      (T.reglement && !T.recu && Number(d.regle) > 0 ?
        '<tr><td>Déjà réglé</td><td class="d">' + nombre(d.regle) + "</td></tr>" +
        '<tr><td><b>Reste dû</b></td><td class="d"><b>' + nombre(reste) + "</b></td></tr>" : "") +
      "</table></div>";
  }

  var somme = T.recu ? (Number(d.regle) || net) : net;
  var intro = T.avoir ? "Arrêté le présent avoir à la somme de : "
    : T.recu ? "Reçu la somme de : "
    : (d.type === "devis" ? "Arrêté le présent devis à la somme de : "
    : "Arrêtée la présente " + (d.type === "proforma" ? "facture pro forma" : "facture") + " à la somme de : ");
  var mots = enLettres(somme);
  /* million et milliard sont des noms : ils appellent « de » quand le compte tombe rond */
  var liaison = /milli(on|ard)s?$/.test(mots) ? " de francs CFA" : " francs CFA";
  var lettres = T.prix ? '<div class="lettres">' + intro + mots + liaison +
    (d.tva ? " toutes taxes comprises" : "") + ".</div>" : "";

  var moyens = [r.banque && ("banque " + r.banque), r.compte && ("compte " + r.compte),
                r.momo && ("Mobile Money " + r.momo)].filter(Boolean).map(echap).join("  ·  ");
  var encaissement = (d.type === "facture" || d.type === "recu") && moyens
    ? '<div class="notes">Règlement : ' + moyens + "</div>" : "";

  return '<div class="feuille nassra"><div class="marque-bloc">' +
    '<svg viewBox="0 0 300 110" width="185" height="68" role="img" aria-label="' + echap(r.nom) + '">' +
    '<path d="M22 74 V44 a38 38 0 0 1 76 0 v30 h-13 V44 a25 25 0 0 0 -50 0 v30 z" fill="#5A2E1E"/>' +
    '<rect x="22" y="80" width="76" height="7" rx="3.5" fill="#C98A3C"/>' +
    '<text x="118" y="58" font-family="Poppins,sans-serif" font-size="27" font-weight="700" letter-spacing="4" fill="#5A2E1E">' + echap(r.nom) + "</text>" +
    '<text x="120" y="76" font-family="Poppins,sans-serif" font-size="7.5" letter-spacing="1.3" fill="#8A7F73">' + echap(r.activite) + "</text></svg>" +
    '<div class="meta"><b>' + T.label.toUpperCase() + "</b><br>N° " + echap(d.numero) +
    "<br>" + echap(r.ville || "") + ", le " + dateFr(d.date) + "</div></div>" +
    '<div class="filet"><i class="a"></i><i class="b"></i></div>' +
    '<div class="parties"><div class="gauche">' + gauche.join("<br>") + "</div>" +
    '<div class="boite"><strong>' + (d.type === "recu" ? "Reçu de" : d.type === "bl" ? "Livré à" : "Client") + "</strong>" +
    echap(cli.nom || "…") + "<br>" + echap(cli.adresse || "…") + "<br>IFU : " + echap(cli.ifu || "…") +
    "  ·  Tél. : " + echap(cli.tel || "…") + "</div></div>" +
    '<table class="art"><thead><tr>' + cols + "</tr></thead><tbody>" + corps + "</tbody></table>" +
    totaux + lettres + encaissement +
    (d.notes ? '<div class="notes">' + echap(d.notes) + "</div>" : "") +
    (T.prix ? '<div class="notes">' +
      (d.tva ? "Montants exprimés en francs CFA. Taxe sur la valeur ajoutée au taux de " + tauxTva(d) + " %."
             : echap(r.mention)) + "</div>" : "") +
    (d.type === "bl" ? '<div class="notes">Le client reconnaît avoir reçu les articles ci-dessus en bon état et en bonne quantité.</div>' : "") +
    bandeCertif(d) +
    '<div class="paraphes"><div class="sig-g">' + (d.cachet !== false ? cachetNassra(r) : "") +
    "<b>Pour " + echap(r.nom) + "</b>" + echap(r.signataire) + "<br>" + echap(r.fonction) + "</div>" +
    /* La livraison se fait contresigner, et le devis se fait accepter. */
    (d.type === "bl"
      ? '<div class="droite"><b>Cachet et signature du client</b>Date, signature, cachet</div>'
      : d.type === "devis"
      ? '<div class="droite"><b>Bon pour accord du client</b>Date, signature, cachet</div>'
      : "") + "</div>" +
    '<div class="pied"><b>' + echap(r.nom) + "</b> — " + echap(r.forme || "") + "<br>RCCM : " + echap(r.rccm) +
    "  ·  IFU : " + echap(r.ifu) + "  ·  Tél. : " + echap(r.tel) + "  ·  " + echap(r.email) + "<br>" +
    echap(r.adresse) + "</div></div>";
}

/* Le choix de maquette est un réglage, pas une propriété du code : un
   nouveau comptoir peut donc adopter l'une ou l'autre sans qu'on y touche.
   À défaut de réglage, la charte ouverte décide. */
function maquetteCourante(){
  var m = reglages().maquette;
  if(m === "nassra" || m === "zadna") return m;
  return charteCourante === "nassra" ? "nassra" : "zadna";
}
function feuilleHTML(d){
  if(TYPES[d.type] && TYPES[d.type].lettre) return feuilleCourrier(d);
  return maquetteCourante() === "nassra" ? feuilleNassra(d) : feuilleZadna(d);
}
/* ---------- la feuille ZADNA ---------- */
function marqueSVG(r){
  return '<svg viewBox="0 0 340 110" width="206" height="67" role="img" aria-label="' + echap(r.nom) + '">' +
    '<g transform="translate(4,14) scale(0.7)">' +
    '<g stroke="#0A0A0A" stroke-width="5" stroke-linecap="round">' +
    '<line x1="60" y1="60" x2="60" y2="14"/><line x1="60" y1="60" x2="106" y2="60"/>' +
    '<line x1="60" y1="60" x2="60" y2="106"/><line x1="60" y1="60" x2="14" y2="60"/></g>' +
    '<circle cx="60" cy="14" r="9" fill="#3B5BFF"/><circle cx="106" cy="60" r="9" fill="#00C2A8"/>' +
    '<circle cx="60" cy="106" r="9" fill="#FF5B3D"/><circle cx="14" cy="60" r="9" fill="#FFC93C"/>' +
    '<circle cx="60" cy="60" r="13" fill="#0A0A0A"/><circle cx="60" cy="60" r="5" fill="#fff"/></g>' +
    '<text x="100" y="56" font-family="Space Grotesk, sans-serif" font-size="25" font-weight="700" letter-spacing="1.2">' +
    '<tspan fill="#3B5BFF">&lt;</tspan><tspan fill="#0A0A0A">' + echap(r.nom) + '</tspan><tspan fill="#00C2A8">/&gt;</tspan></text>' +
    '<text x="102" y="76" font-family="JetBrains Mono, monospace" font-size="7.2" letter-spacing="1.4" fill="#6B6B6B">' +
    echap(r.activite) + "</text></svg>";
}

function feuilleZadna(d){
  var T = TYPES[d.type], r = reglages(), cli = d.client || {};
  var net = netAPayer(d), brut = totalLignes(d), reste = resteDu(d);
  var tx = T.prix ? tauxTva(d) : 0;
  var certifiable = estCertifiable(d);
  var cert = d.cert || {};
  var grpDefaut = r.groupeDefaut || "E";

  /* en-tete : le nom a gauche, les coordonnees de l'entreprise a droite */
  var tete = '<div class="tete">' + marqueSVG(r) +
    '<div class="coord">' + echap(r.adresse).replace(/ — /g, "<br>") + "<br>" +
    echap(r.tel) + "<br>" + echap(r.email) + "</div></div>" +
    '<div class="regle"><i class="a"></i><i class="b"></i></div>';

  var repere = '<div class="repere"><span>' + echap(r.ville || "") + ", le <b>" + dateFr(d.date) + "</b></span>" +
    '<span>Réf. <b>' + echap(d.numero) + "</b></span></div>";

  /* titre du document et references, puis le destinataire */
  var infos = [];
  /* le reçu reprend objet, pièce d'origine et mode de règlement dans sa quittance */
  if(d.objet && !T.recu) infos.push("<b>Objet :</b> " + echap(d.objet));
  if(d.source && !T.recu) infos.push((T.avoir ? "Avoir sur la facture " : "Établi d'après ") + echap(d.source));
  if(T.validite) infos.push("Validité de l'offre : " + echap(r.validite));
  if(T.reglement && !T.recu && d.echeance) infos.push("Échéance de règlement : " + dateFr(d.echeance));

  var ouverture = '<div class="ouverture"><div class="objet">' +
    '<h2 class="type"><small>PIÈCE ' + T.code + " · " + (d.annee || new Date().getFullYear()) + "</small>" +
    T.label.toUpperCase() + "</h2>" +
    (infos.length ? "<p>" + infos.join("<br>") + "</p>" : "") + "</div>" +
    '<div class="destinataire"><strong>' +
    (d.type === "recu" ? "Reçu de" : d.type === "bl" ? "Livré à" : "Client") + "</strong>" +
    '<div class="qui">' + echap(cli.nom || "…") + "</div>" +
    echap(cli.adresse || "…") + "<br>IFU : " + echap(cli.ifu || "…") +
    "<br>Tél. : " + echap(cli.tel || "…") + "</div></div>";

  var colGr = certifiable ? '<th class="d" style="width:11mm">Gr.</th>' : "";
  var cols = T.prix
    ? '<th style="width:8mm">N°</th><th>Désignation</th><th class="d" style="width:16mm">Qté</th>' +
      '<th class="d" style="width:26mm">P.U.' + (d.saisieTTC ? " TTC" : "") + '</th>' +
      '<th class="d" style="width:30mm">Montant' + (d.saisieTTC ? " TTC" : "") + "</th>" + colGr
    : '<th style="width:8mm">N°</th><th>Désignation</th><th class="d" style="width:26mm">Qté commandée</th>' +
      '<th class="d" style="width:26mm">Qté livrée</th>';

  var utiles = (d.lignes||[]).filter(function(l){
    return String(l.d||"").trim() || Number(l.q) || Number(l.pu) || Number(l.ttc);
  });
  if(!utiles.length) utiles = [{d:"…", q:"", pu:0}];
  var corps = utiles.map(function(l,i){
    return "<tr><td>" + String(i+1).padStart(2,"0") + "</td><td>" + echap(l.d) +
      (l.code ? '<span style="display:block;font-size:8pt;color:#6b6b6b;letter-spacing:.02em">Réf. ' + echap(l.code) + "</span>" : "") +
      '</td><td class="d">' + echap(l.q) + "</td>" +
      (T.prix ? '<td class="d">' + nombre(prixLigne(d,l)) + '</td><td class="d">' + nombre((Number(l.q)||0) * prixLigne(d,l)) + "</td>"
              : '<td class="d remplir"></td>') +
      (certifiable ? '<td class="d">' + echap(l.g || grpDefaut) + "</td>" : "") + "</tr>";
  }).join("");

  /* le detail des totaux a droite, le net a payer en barre pleine largeur */
  var totaux = "";
  if(T.prix){
    var det = [];
    if(Number(d.remise)){
      det.push([d.saisieTTC ? "Sous-total TTC" : "Sous-total", nombre(brut)]);
      det.push(["Remise", "− " + nombre(d.remise)]);
    }
    if(tx && d.saisieTTC){
      /* Les colonnes sont en TTC : le détail se lit dans le même sens. */
      det.push(["Montant TTC", nombre(montantHT(d) + montantTVA(d))]);
      det.push(["dont TVA " + tx + " %", nombre(montantTVA(d))]);
      det.push(["Montant HT", nombre(montantHT(d))]);
    } else if(tx){
      det.push(["Montant HT", nombre(montantHT(d))]);
      det.push(["TVA " + tx + " %", nombre(montantTVA(d))]);
    } else if(tauxAib(d)){
      det.push(["Montant HT", nombre(montantHT(d))]);
    }
    if(tauxAib(d)) det.push(["AIB " + tauxAib(d) + " %", nombre(montantAIB(d))]);
    if(T.reglement && !T.recu && Number(d.regle) > 0){
      det.push(["Déjà réglé", nombre(d.regle)]);
      det.push(["Reste dû", nombre(reste)]);
    }
    totaux = (det.length && !T.recu ? '<div class="totaux"><table>' + det.map(function(l){
        return "<tr><td>" + l[0] + '</td><td class="d">' + l[1] + "</td></tr>";
      }).join("") + "</table></div>" : "") +
      '<div class="barre-net"><span class="lib">' +
      (T.avoir ? "Montant de l'avoir" : T.recu ? "Montant reçu" : "Net à payer" + (tx ? " TTC" : "")) + "</span>" +
      '<span class="val">' + nombre(T.recu ? (Number(d.regle) || net) : net) + "<i>F CFA</i></span></div>";
  }

  /* le recu ne liste pas les articles : il constate un paiement */
  var quittance = "";
  if(T.recu){
    var recu = Number(d.regle) || net;
    var du = Math.max(0, net - recu);
    var l = [];
    l.push(["Re\u00e7u de", "<b>" + echap(cli.nom || "\u2026") + "</b>"]);
    if(d.objet || d.source){
      l.push(["En r\u00e8glement de", echap(d.objet || "") +
        (d.objet && d.source ? " \u2014 " : "") + (d.source ? "pi\u00e8ce " + echap(d.source) : "")]);
    }
    l.push(["Mode de r\u00e8glement", echap(d.mode || "\u2026")]);
    if(du > 0) l.push(["Reste d\u00fb", '<span class="du">' + nombre(du) + " F CFA</span>"]);
    quittance = '<div class="quittance"><dl>' + l.map(function(x){
      return "<dt>" + x[0] + "</dt><dd>" + x[1] + "</dd>";
    }).join("") + "</dl></div>";
  }

  var somme = T.recu ? (Number(d.regle) || net) : net;
  var intro = T.avoir ? "Arrêté le présent avoir à la somme de : "
    : T.recu ? "Reçu la somme de : "
    : (d.type === "devis" ? "Arrêté le présent devis à la somme de : "
    : "Arrêtée la présente " + (d.type === "proforma" ? "facture pro forma" : "facture") + " à la somme de : ");
  var mots = enLettres(somme);
  /* million et milliard sont des noms : ils appellent « de » quand le compte tombe rond */
  var liaison = /milli(on|ard)s?$/.test(mots) ? " de francs CFA" : " francs CFA";
  var lettres = T.prix ? '<div class="lettres">' + intro + mots + liaison +
    (d.tva ? " toutes taxes comprises" : "") + ".</div>" : "";

  var moyens = [r.banque && ("banque " + r.banque), r.compte && ("compte " + r.compte),
                r.momo && ("Mobile Money " + r.momo)].filter(Boolean).map(echap).join("  ·  ");
  /* sur un recu, le mode figure deja dans la quittance : cette ligne dit comment payer */
  var encaissement = d.type === "facture" && moyens
    ? '<div class="notes">Règlement : ' + moyens + "</div>" : "";

  /* ZADNA signe toujours a droite ; a gauche, ce que le client doit remplir
     change selon la nature du document */
  var signature = '<div class="sig-d">' + (d.cachet !== false ? cachetSVG(r) : "") +
    "<b>Pour " + echap(r.nom) + "</b>" +
    '<span class="qui">' + echap(r.signataire) + "</span><br>" + echap(r.fonction) + "</div>";

  var cote_client;
  if(T.recu){
    /* un recu est signe par celui qui encaisse, pas par le client */
    cote_client = '<div class="compact"><b>Acquit</b>' +
      "Re\u00e7u \u00e9tabli en un exemplaire et remis au client.</div>";
  } else if(d.type === "bl"){
    /* a la livraison, on veut le nom et la qualite de qui receptionne */
    cote_client = '<div class="compact"><b>R\u00e9ception par le client</b>' +
      '<div class="recu-par">Nom : <i></i><br>Qualit\u00e9 : <i></i><br>Date et signature</div></div>';
  } else if(d.type === "devis"){
    /* Le devis se fait contresigner : cette case est ce qui vaut acceptation,
       et sans elle un devis accepté ne garde aucune trace signée. */
    cote_client = "<div><b>Bon pour accord du client</b>Date, signature, cachet</div>";
  } else {
    /* Pro forma, facture et avoir ne se contresignent pas. */
    cote_client = "";
  }
  var paraphes = '<div class="paraphes">' + cote_client + signature + "</div>";

  /* la bande de certification : elle ne s imprime que si e-MECeF a repondu */
  var bande = "";
  if(certifiable && (cert.code || cert.nim || cert.qr)){
    var img = qrDataURL(cert.qr, 240);
    var elts = [];
    if(cert.nim) elts.push(["NIM", echap(cert.nim)]);
    if(cert.code) elts.push(["Code MECeF", echap(cert.code)]);
    if(cert.compteurs) elts.push(["Compteurs", echap(cert.compteurs)]);
    if(cert.date) elts.push(["Certifiée le", echap(cert.date)]);
    bande = '<div class="certif">' +
      (img ? '<div class="qr"><img src="' + img + '" alt="QR de vérification e-MECeF"></div>' : "") +
      '<div class="corps"><div class="titre">Facture normalisée · ' +
      echap(d.typeMecef || "FV") + ' · e-MECeF</div><dl>' +
      elts.map(function(x){ return "<dt>" + x[0] + "</dt><dd>" + x[1] + "</dd>"; }).join("") +
      "</dl></div></div>";
  }

  var pied = '<div class="pied"><div class="regle"><i class="a"></i><i class="b"></i></div>' +
    '<div class="mentions"><span><b>' + echap(r.forme || r.nom) + "</b><br>RCCM : " + echap(r.rccm) +
    "  ·  IFU : " + echap(r.ifu) + "</span>" +
    '<span class="sceau-pale">&lt;ZSX/&gt;</span>' +
    '<span class="droite">' + echap(r.tel) + "<br>" + echap(r.email) + "</span></div></div>";

  return '<div class="feuille zadna">' + tete + repere + ouverture +
    (T.recu ? "" : '<table class="art"><thead><tr>' + cols + "</tr></thead><tbody>" + corps + "</tbody></table>") +
    totaux + lettres + quittance + encaissement +
    (d.notes ? '<div class="notes">' + echap(d.notes) + "</div>" : "") +
    (T.prix && !T.recu ? '<div class="notes">' +
      (d.tva ? "Montants exprimés en francs CFA. Taxe sur la valeur ajoutée au taux de " + tx + " %."
             : echap(r.mention)) + "</div>" : "") +
    (d.type === "bl" ? '<div class="notes">Le client reconnaît avoir reçu les articles ci-dessus en bon état et en bonne quantité.</div>' : "") +
    bande + paraphes + pied + "</div>";
}

/* ---------- le Répertoire des Prix de Référence ----------
   10 050 lignes : on ne les charge pas, on les interroge. Les garder en
   mémoire, dans la liste de suggestions du champ Désignation et dans le
   miroir hors ligne coûterait deux mégaoctets et une liste inutilisable,
   pour un document qu'on ne consulte que ponctuellement. */
var rprResultats = [];
var rprMinuteur = null;

function chercherRepertoire(q){
  var t = String(q || "").trim().replace(/[%_]/g, " ");
  if(!sb || t.length < 3) return Promise.resolve([]);
  return sb.from("repertoire").select("code,d,famille,u,bi,bs")
    .ilike("d", "%" + t + "%").order("d").limit(30)
    .then(function(r){
      if(r.error){ console.warn("répertoire", r.error.message); return []; }
      return r.data || [];
    });
}

function rprHTML(liste, avecAjout){
  if(!liste.length) return '<p style="color:var(--doux);font-size:12.5px;margin:12px 0 0">Aucun article du Répertoire ne correspond.</p>';
  return '<div class="bloc" style="margin-top:10px"><table class="liste"><thead><tr>' +
    "<th>Désignation</th><th>Unité</th><th class=\"num\">Fourchette TTC</th>" +
    (avecAjout ? "<th></th>" : "") + "</tr></thead><tbody>" +
    liste.map(function(a, i){
      return "<tr><td>" + echap(a.d) +
        '<div style="color:var(--tres-doux);font-size:11.5px;font-family:var(--mono)">' + echap(a.code) + "</div></td>" +
        '<td data-lib="Unité">' + echap(a.u || "—") + "</td>" +
        '<td class="num" data-lib="Fourchette TTC">' +
        (a.bi ? nombre(a.bi) + " – " : "jusqu'à ") + nombre(a.bs) + "</td>" +
        (avecAjout ? '<td class="act"><button class="btn" data-rpr-ajout="' + i + '">Ajouter</button></td>' : "") +
        "</tr>";
    }).join("") + "</tbody></table></div>";
}

function carteRepertoire(){
  return '<div class="carte"><h3>Répertoire des Prix de Référence</h3>' +
    '<p style="color:var(--doux);margin:0 0 10px;font-size:12.5px">Cherchez un article du Répertoire de l\'État : ' +
    "la ligne est ajoutée avec sa référence et sa fourchette TTC.</p>" +
    '<input type="search" id="rpr-q" placeholder="Trois lettres suffisent — onduleur, agrafe, ciment…">' +
    '<div id="rpr-res"></div></div>';
}

/* L'import lit le fichier déposé à côté de l'application : le Répertoire est
   un document public, il voyage avec le code plutôt que dans une base à part.
   Une nouvelle édition se charge en remplaçant ce fichier. */
function importerRepertoire(bouton){
  if(!sb){ signal("Connexion requise pour importer"); return; }
  var libelle = bouton.textContent;
  bouton.disabled = true; bouton.textContent = "Lecture…";
  fetch("./repertoire-26.2.json").then(function(r){
    if(!r.ok) throw new Error("fichier introuvable (" + r.status + ")");
    return r.json();
  }).then(function(j){
    var fiches = j.fiches || [], lots = [], fait = 0;
    for(var i = 0; i < fiches.length; i += 500) lots.push(fiches.slice(i, i + 500));
    return lots.reduce(function(chaine, lot){
      return chaine.then(function(){
        return sb.from("repertoire").upsert(lot.map(function(a){
          return {code:a.code, d:a.d, famille:a.famille, u:a.u,
                  bi:a.bi, bs:a.bs, specs:a.specs, edition:j.edition};
        }), {onConflict:"code"}).then(function(r){
          if(r.error) throw r.error;
          fait += lot.length;
          bouton.textContent = fait + " / " + fiches.length;
        });
      });
    }, Promise.resolve()).then(function(){
      signal(fait + " articles du Répertoire importés (édition " + j.edition + ")");
      bouton.disabled = false; bouton.textContent = libelle;
    });
  }).catch(function(e){
    signal("Import impossible : " + (e && e.message));
    bouton.disabled = false; bouton.textContent = libelle;
  });
}

function refArticle(designation){
  var q = String(designation || "").trim().toLowerCase();
  if(!q) return null;
  var l = Store.tout("articles");
  for(var i = 0; i < l.length; i++){
    if(l[i].bs && String(l[i].d).trim().toLowerCase() === q) return l[i];
  }
  return null;
}
function majRPR(){
  var zone = document.getElementById("rpr-info");
  if(!zone || !brouillon) return;
  var lignes = [];
  brouillon.lignes.forEach(function(l,i){
    /* La fourchette voyage avec la ligne dès qu'elle vient du Répertoire :
       c'est un instantané, et c'est ce qu'il faut — le Répertoire change
       d'édition, un devis déjà remis ne doit pas changer de plafond. */
    var a = Number(l.bs)
      ? {d:l.d, bi:Number(l.bi) || 0, bs:Number(l.bs)}
      : refArticle(l.d);
    if(!a) return;
    /* Les bornes du Répertoire sont TTC. Sous TPS, le prix facturé est déjà
       le prix payé : on compare directement. Au réel, c'est le P.U. majoré
       de la TVA que l'acheteur public débourse — c'est lui qu'il faut
       confronter au plafond, sinon on se croit conforme à tort. */
    var tx = tauxTva(brouillon);
    /* En saisie TTC, le prix tapé EST le prix payé : on le compare tel quel,
       sans le reconstituer — pas d'arrondi entre le Répertoire et nous. */
    var paye = brouillon.saisieTTC
      ? prixLigne(brouillon, l)
      : Math.round((Number(l.pu) || 0) * (1 + tx / 100));
    var trop = paye > a.bs;
    var plafondHT = tx ? Math.round(a.bs / (1 + tx / 100)) : a.bs;
    lignes.push('<div class="rpr' + (trop ? " depasse" : "") + '"><b>Ligne ' + (i+1) + "</b> " +
      echap(a.d) + " — répertoire de l'État : " + nombre(a.bi) + " à " + nombre(a.bs) + " F CFA TTC" +
      (tx ? " · soit " + nombre(plafondHT) + " F CFA HT au plus" : "") +
      (trop ? " · votre prix dépasse le plafond de " + nombre(paye - a.bs) + " F CFA" : "") + "</div>");
  });
  zone.innerHTML = lignes.length
    ? '<div class="rpr-bloc">' + lignes.join("") + "</div>"
    : "";
}
function majApercu(){
  var porte = document.getElementById("porte");
  if(!porte || !brouillon) return;
  porte.innerHTML = feuilleHTML(brouillon);
  var scene = porte.parentElement;
  var z = Math.min(1, (scene.clientWidth - 28) / (210 * 96 / 25.4));
  porte.style.transform = "scale(" + z + ")";
  scene.style.height = Math.round(297 * 96 / 25.4 * z + 4) + "px";
}
function majSommes(){
  var d = brouillon;
  d.lignes.forEach(function(l,i){
    var c = document.querySelector('[data-montant="' + i + '"]');
    if(c) c.textContent = nombre((Number(l.q)||0) * prixLigne(d,l));
  });
  function put(k,v){ var e = document.querySelector('[data-somme="' + k + '"]'); if(e) e.textContent = v; }
  put("brut", fcfa(totalLignes(d)));
  put("ht", fcfa(montantHT(d)));
  put("ttc", fcfa(montantHT(d) + montantTVA(d)));
  put("tva", fcfa(montantTVA(d)));
  put("aib", fcfa(montantAIB(d)));
  put("net", fcfa(netAPayer(d)));
  put("reste", fcfa(resteDu(d)));
  var lib = document.querySelector(".somme dt.total");
  if(lib) lib.textContent = d.tva ? "Net à payer TTC" : "Net à payer";
  majRPR();
  majApercu();
}
/* Le pied de page est en position absolue dans la feuille : il se pose donc au bas
   du bloc, pas au bas du papier. On arrondit la hauteur du bloc au nombre entier
   de pages A4 qu il occupe, et le pied retombe exactement en bas de la derniere. */
function calerSurA4(f){
  if(!f) return;
  var A4 = 297 * 96 / 25.4;
  f.style.minHeight = "0";
  var pages = Math.max(1, Math.ceil((f.getBoundingClientRect().height - 2) / A4));
  f.style.minHeight = (pages * 297) + "mm";
  return pages;
}
function imprimer(){
  var zone = document.getElementById("impression");
  zone.innerHTML = feuilleHTML(brouillon);
  calerSurA4(zone.querySelector(".feuille"));
  window.print();
}


/* ======================= chartes ======================= */
/* Chaque maison garde son identité : la charte ne fait que réécrire les
   variables CSS, la maquette de la feuille se choisit plus bas. */
var CHARTES = {
  zadna: {},
  nassra: {
    clair:{ "--papier":"#FBF8F3", "--surface":"#FFFFFF", "--surface2":"#F5EFE5",
            "--ligne":"#E5DACA", "--ligne-forte":"#CDBCA5",
            "--encre":"#241A14", "--doux":"#6F6157", "--tres-doux":"#9C8C7E",
            "--marque":"#5A2E1E", "--ocre":"#C98A3C", "--ivoire":"#F2E9DA",
            "--vert":"#2C6A4E", "--vert-fond":"#E4F0E8",
            "--brique":"#A6402A", "--brique-fond":"#F8E6E1",
            "--bleu":"#2B5470", "--bleu-fond":"#E4EDF3" },
    sombre:{ "--papier":"#17120F", "--surface":"#211A15", "--surface2":"#2A211A",
            "--ligne":"#3A2E25", "--ligne-forte":"#4E3E32",
            "--encre":"#F3E9DE", "--doux":"#AC9A8A", "--tres-doux":"#87776A",
            "--marque":"#E8BE92", "--ocre":"#D79B4E", "--ivoire":"#2E241C",
            "--vert":"#7CC69C", "--vert-fond":"#1D2E25",
            "--brique":"#E79178", "--brique-fond":"#331F1A",
            "--bleu":"#8CB6D0", "--bleu-fond":"#1B2831" }
  }
};
var charteCourante = "zadna";

function nuitTombee(){
  var t = document.documentElement.getAttribute("data-theme");
  if(t === "dark") return true;
  if(t === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}

function appliquerCharte(code){
  charteCourante = CHARTES[code] ? code : "zadna";
  var c = CHARTES[charteCourante];
  var st = document.documentElement.style;
  /* on efface d'abord : sans ça, passer de NASSRA à ZADNA laisserait les
     variables brunes en place, ZADNA n'ayant rien à réécrire */
  Object.keys(CHARTES.nassra.clair).forEach(function(k){ st.removeProperty(k); });
  var jeu = c.clair ? (nuitTombee() ? c.sombre : c.clair) : null;
  if(jeu) Object.keys(jeu).forEach(function(k){ st.setProperty(k, jeu[k]); });
  var nom = document.querySelector(".sceau .nom");
  if(nom) nom.innerHTML = charteCourante === "nassra"
    ? echap(reglages().nom || "NASSRA")
    : '<span style="color:var(--ocre)">&lt;</span><span style="color:var(--encre)">' +
      echap(reglages().nom || "ZADNA S.X") + '</span><span style="color:var(--ocre)">/&gt;</span>';
}

if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
    appliquerCharte(charteCourante);
  });
}

/* ======================= portail ======================= */
/* Rien ne s'affiche avant la connexion : l'app entière reste masquée tant
   qu'on ne sait pas qui entre ni dans quel comptoir. */
var Session = { email:null, comptoirs:[] };

function portail(html){ document.getElementById("portail-corps").innerHTML = html; }

function demarrer(){
  try {
    sb = window.supabase.createClient(SB_URL, SB_CLE);
  } catch(e){
    portail('<div class="erreur">Service injoignable. Vérifiez votre connexion, puis rechargez la page.</div>');
    return;
  }
  sb.auth.getSession().then(function(s){
    if(s.data && s.data.session) apresConnexion();
    else montrerConnexion();
  });
}

function montrerConnexion(msg, mode){
  var inscription = mode === "creer";
  portail(
    "<h2>" + (inscription ? "Créer votre accès" : "Connexion") + "</h2>" +
    '<p class="aide">' + (inscription
      ? "Votre adresse doit figurer parmi les accès autorisés, sinon le compte ne verra aucun comptoir."
      : "Vos documents vous suivent d'un appareil à l'autre.") + "</p>" +
    (msg ? '<div class="erreur">' + echap(msg) + "</div>" : "") +
    '<div class="champ"><label for="p-email">Adresse e-mail</label>' +
    '<input id="p-email" type="email" autocomplete="username" inputmode="email"></div>' +
    '<div class="champ"><label for="p-mdp">Mot de passe</label>' +
    '<input id="p-mdp" type="password" autocomplete="' + (inscription ? "new-password" : "current-password") + '"></div>' +
    '<button class="btn principal" id="p-valider">' + (inscription ? "Créer l'accès" : "Se connecter") + "</button>" +
    '<button class="lien" id="p-bascule">' +
    (inscription ? "J'ai déjà un accès" : "Première connexion ? Créer mon accès") + "</button>"
  );
  document.getElementById("p-bascule").onclick = function(){
    montrerConnexion("", inscription ? "entrer" : "creer");
  };
  document.getElementById("p-valider").onclick = function(){ soumettreConnexion(inscription); };
  document.getElementById("p-mdp").onkeydown = function(e){
    if(e.key === "Enter") soumettreConnexion(inscription);
  };
  var e = document.getElementById("p-email"); if(e) e.focus();
}

function soumettreConnexion(inscription){
  var email = (document.getElementById("p-email").value || "").trim();
  var mdp = document.getElementById("p-mdp").value || "";
  if(!email || !mdp){
    montrerConnexion("Renseignez votre adresse et votre mot de passe.", inscription ? "creer" : "entrer");
    return;
  }
  var btn = document.getElementById("p-valider");
  btn.disabled = true; btn.textContent = "Un instant…";
  var p = inscription
    ? sb.auth.signUp({email:email, password:mdp})
    : sb.auth.signInWithPassword({email:email, password:mdp});
  p.then(function(r){
    if(r.error){
      montrerConnexion(traduireErreurAuth(r.error.message), inscription ? "creer" : "entrer");
      document.getElementById("p-email").value = email;
      return;
    }
    /* Sans session après une inscription, c'est que la confirmation par
       courriel est exigée : le dire, plutôt que de laisser un écran mort. */
    if(!r.data || !r.data.session){
      portail("<h2>Vérifiez votre boîte</h2>" +
        '<p class="aide">Un message de confirmation part vers <b>' + echap(email) +
        "</b>. Ouvrez le lien qu'il contient, puis revenez vous connecter.</p>" +
        '<button class="lien" id="p-retour">Revenir à la connexion</button>');
      document.getElementById("p-retour").onclick = function(){ montrerConnexion(); };
      return;
    }
    apresConnexion();
  });
}

function traduireErreurAuth(m){
  m = String(m || "");
  if(/Invalid login/i.test(m))        return "Adresse ou mot de passe incorrect.";
  if(/already registered/i.test(m))   return "Cet accès existe déjà — connectez-vous.";
  if(/at least|should be at least/i.test(m)) return "Le mot de passe doit faire au moins 6 caractères.";
  if(/Email not confirmed/i.test(m))  return "Adresse pas encore confirmée : ouvrez le lien reçu par courriel.";
  if(/rate limit|too many/i.test(m))  return "Trop de tentatives. Patientez une minute.";
  return m;
}

function apresConnexion(){
  portail('<p class="attente">Chargement de vos comptoirs…</p>');
  return sb.auth.getUser().then(function(u){
    Session.email = (u.data && u.data.user) ? u.data.user.email : "";
    return sb.from("comptoirs").select("code,nom").order("nom");
  }).then(function(r){
    if(r.error) return echecPortail(r.error.message);
    Session.comptoirs = r.data || [];
    /* La liste blanche filtre côté base : une liste vide veut dire que ce
       compte n'est autorisé nulle part, pas qu'il n'existe aucun comptoir. */
    if(!Session.comptoirs.length){
      return echecPortail("Le compte " + Session.email + " n'a accès à aucun comptoir. " +
        "Faites ajouter cette adresse aux accès autorisés.");
    }
    var dernier = null;
    try { dernier = localStorage.getItem("comptoir:dernier"); } catch(e){}
    var connu = Session.comptoirs.some(function(c){ return c.code === dernier; });
    if(dernier && connu) return ouvrirComptoir(dernier);
    if(Session.comptoirs.length === 1) return ouvrirComptoir(Session.comptoirs[0].code);
    montrerComptoirs();
  });
}

function echecPortail(msg){
  portail('<div class="erreur">' + echap(msg) + "</div>" +
    '<button class="lien" id="p-sortir">Se déconnecter</button>');
  document.getElementById("p-sortir").onclick = seDeconnecter;
}

function montrerComptoirs(){
  portail("<h2>Quel comptoir ?</h2>" +
    '<p class="aide">Connecté comme ' + echap(Session.email) + "</p>" +
    '<div class="choix-comptoir">' +
    Session.comptoirs.map(function(c){
      return '<button data-comptoir="' + echap(c.code) + '"><span>' +
        '<span class="cnom">' + echap(c.nom) + "</span>" +
        '<span class="ccode">' + echap(c.code) + "</span></span></button>";
    }).join("") + "</div>" +
    '<button class="lien" id="p-sortir">Se déconnecter</button>');
  Array.prototype.forEach.call(document.querySelectorAll("[data-comptoir]"), function(b){
    b.onclick = function(){ ouvrirComptoir(b.getAttribute("data-comptoir")); };
  });
  document.getElementById("p-sortir").onclick = seDeconnecter;
}

function ouvrirComptoir(code){
  try { localStorage.setItem("comptoir:dernier", code); } catch(e){}
  var c = Session.comptoirs.filter(function(x){ return x.code === code; })[0];
  appliquerCharte(code);
  document.getElementById("portail").hidden = true;
  document.querySelector(".app").hidden = false;
  document.title = "Comptoir " + ((c && c.nom) || code);
  var el = document.getElementById("etat-compte");
  if(el) el.textContent = Session.email || "";
  Store.init(code);
}

function changerDeComptoir(){
  try { localStorage.removeItem("comptoir:dernier"); } catch(e){}
  Store.canaux.forEach(function(c){ try { sb.removeChannel(c); } catch(e){} });
  Store.canaux = [];
  vue = "bord"; brouillon = null; formulaire = null;
  document.querySelector(".app").hidden = true;
  document.getElementById("portail").hidden = false;
  montrerComptoirs();
}

function seDeconnecter(){
  var fin = function(){
    try { localStorage.removeItem("comptoir:dernier"); } catch(e){}
    location.reload();
  };
  try { sb.auth.signOut().then(fin, fin); } catch(e){ fin(); }
}

/* ======================= interactions ======================= */
document.addEventListener("click", function(e){
  function c(s){ return e.target.closest(s); }
  var el;

  if((el = c("[data-vue]"))){ aller(el.dataset.vue); return; }
  if((el = c("[data-neuf]"))){ nouveauDoc(el.dataset.neuf); return; }
  if((el = c("[data-convertir]"))){ convertir(el.dataset.convertir); return; }

  if((el = c("[data-suppr]"))){
    e.stopPropagation();
    var cle = el.dataset.suppr, part = cle.split(":");
    if(aConfirmer === cle){ aConfirmer = null; Store.retirer(part[0], part[1]); }
    else { aConfirmer = cle; rendre(true); }
    return;
  }
  if((el = c("[data-form-neuf]"))){
    formulaire = {col:el.dataset.formNeuf, obj:{}};
    aConfirmer = null; rendre(true);
    var p = document.querySelector("#form-panneau input"); if(p) p.focus();
    return;
  }
  if((el = c("[data-modif]"))){
    var m = el.dataset.modif.split(":");
    var o = Store.un(m[0], m[1]);
    if(o){ formulaire = {col:m[0], obj:JSON.parse(JSON.stringify(o))}; aConfirmer = null; rendre(true); }
    return;
  }
  if(c("#form-annul")){ formulaire = null; rendre(true); return; }
  if(c("#form-enr")){
    var f = formulaire;
    if(!f) return;
    var vide = f.col === "clients" ? !String(f.obj.nom||"").trim() : !String(f.obj.d||"").trim();
    if(vide){ signal(f.col === "clients" ? "Le nom est obligatoire" : "La désignation est obligatoire"); return; }
    if(f.col === "articles") f.obj.pu = Number(f.obj.pu) || 0;
    formulaire = null;
    Store.poser(f.col, f.obj);
    rendre(true);
    signal("Enregistré");
    return;
  }

  if((el = c("[data-ouvrir]"))){ ouvrirDoc(el.dataset.ouvrir); return; }

  if((el = c("[data-rpr-ajout]"))){
    var choisi = rprResultats[Number(el.dataset.rprAjout)];
    if(!choisi || !brouillon) return;
    var ligneRpr = {d:choisi.d, q:1, pu:0, code:choisi.code, bi:choisi.bi, bs:choisi.bs};
    if(brouillon.saisieTTC) ligneRpr.ttc = "";
    var premiereVide = brouillon.lignes.length === 1 && !String(brouillon.lignes[0].d || "").trim();
    if(premiereVide) brouillon.lignes[0] = ligneRpr; else brouillon.lignes.push(ligneRpr);
    rendre(true);
    signal("Ajouté — plafond " + nombre(choisi.bs) + " F TTC");
    return;
  }
  if((el = c("#rpr-import"))){ importerRepertoire(el); return; }
  if(c("#ajout-ligne")){ brouillon.lignes.push({d:"",q:1,pu:0}); rendre(true); return; }
  if((el = c("[data-suppr-ligne]"))){
    brouillon.lignes.splice(Number(el.dataset.supprLigne), 1);
    if(!brouillon.lignes.length) brouillon.lignes.push({d:"",q:1,pu:0});
    rendre(true); return;
  }
  if(c("#enregistrer")){
    var d = brouillon;
    if(!String(d.client.nom || "").trim()){ signal("Indiquez au moins le nom du client"); return; }
    if(TYPES[d.type].avoir && !String(d.source || "").trim()){
      signal("Indiquez la facture d'origine de l'avoir");
      return;
    }
    if(!d.id){
      /* un autre appareil a pu prendre ce numéro entre-temps */
      var pris = Store.tout("documents").some(function(x){ return x.numero === d.numero; });
      if(pris){
        var n = prochainNumero(d.type);
        d.seq = n.seq; d.annee = n.annee; d.numero = n.numero;
        signal("Numéro déjà pris ailleurs — renuméroté en " + d.numero);
      }
      d.id = uid();
    }
    Store.poser("documents", JSON.parse(JSON.stringify(d)));
    rendre(true);
    signal(TYPES[d.type].court + " " + d.numero + " enregistré");
    return;
  }
  if(c("#bascule-apercu")){
    var ouvert = document.body.classList.toggle("apercu");
    el = document.getElementById("bascule-apercu");
    if(el) el.textContent = ouvert ? "Masquer" : "Afficher";
    if(ouvert) majApercu();
    return;
  }
  if(c("#changer-comptoir")){ changerDeComptoir(); return; }
  if(c("#imprimer") || c("#imprimer2")){ imprimer(); return; }
  if(c("#supprimer")){
    if(aConfirmer === "doc"){ aConfirmer = null; Store.retirer("documents", brouillon.id); aller("documents"); }
    else { aConfirmer = "doc"; rendre(true); }
    return;
  }

  if(c("#enr-reglages")){
    var r = reglages();
    Array.prototype.forEach.call(document.querySelectorAll("[data-reglage]"), function(i){
      r[i.dataset.reglage] = i.value;
    });
    r.id = "entreprise";
    Store.poser("reglages", r);
    signal("Réglages enregistrés");
    return;
  }
  if(c("#export")){
    var paquet = {exporte:new Date().toISOString()};
    COLS.forEach(function(k){ paquet[k] = Store.tout(k); });
    var texte = JSON.stringify(paquet, null, 2);
    var zone = document.getElementById("zone-export");
    var dl = null;
    try { if(window.claude && typeof claude.use === "function") dl = claude.use("downloads"); } catch(err){ dl = null; }
    Promise.resolve(dl).catch(function(){ return null; }).then(function(api){
      if(api && api.save){
        return api.save({filename:"zadna-sauvegarde-" + auj() + ".json", data:texte})
          .then(function(){ signal("Sauvegarde enregistrée"); })
          .catch(function(){ montrerTexte(zone, texte); });
      }
      montrerTexte(zone, texte);
    });
    return;
  }
});
function montrerTexte(zone, texte){
  if(!zone) return;
  zone.innerHTML = '<p style="color:var(--doux);margin:14px 0 6px">Copiez ce contenu dans un fichier <code>.json</code> :</p>' +
    '<textarea readonly style="min-height:180px;font-family:ui-monospace,monospace;font-size:12px"></textarea>';
  zone.querySelector("textarea").value = texte;
  signal("Sauvegarde affichée ci-dessous");
}

       serveur, et les réponses reviendraient dans le désordre. */

      chercherRepertoire(saisi).then(function(liste){

        var z = document.getElementById(avecAjout ? "rpr-res" : "rpr-cat-res");

    filtreCat.texte = t.value;
    var p2 = t.selectionStart;
    rendre(true);
    var n2 = document.getElementById("c-texte");
    if(n2){ n2.focus(); try { n2.setSelectionRange(p2, p2); } catch(err){} }
    return;
  }
  if(formulaire && t.dataset.form){ formulaire.obj[t.dataset.form] = t.value; return; }
  if(!brouillon) return;

  if(t.id === "pu-ttc"){
    brouillon.saisieTTC = t.checked;
    var txB = tauxTva(brouillon);
    brouillon.lignes.forEach(function(l){
      /* Ce qui est déjà tapé reste ce qu'il vaut : on note seulement son
         équivalent dans l'autre unité, sans réinterpréter le nombre. */
      if(t.checked) l.ttc = (l.pu === "" ? "" : ttcDepuisHT(l.pu, txB));
      else delete l.ttc;
    });
    rendre(true);
    return;
  }
  if(t.id === "tva-actif"){
    brouillon.tva = t.checked;
    if(t.checked && !brouillon.tauxTva) brouillon.tauxTva = Number(reglages().tauxTva) || 18;
    /* Sans TVA, le prix payé est le hors taxe : le HT remonte au niveau du TTC. */
    recalerLignesTTC(brouillon);
    if(brouillon.saisieTTC) rendre(true); else majSommes();
    return;
  }
  if(t.id === "cachet-actif"){ brouillon.cachet = t.checked; majApercu(); return; }

  if(t.dataset.l !== undefined){
    var i = Number(t.dataset.l), l = brouillon.lignes[i], c = t.dataset.c;
    l[c] = (c === "d" || c === "g" || c === "code") ? t.value : (t.value === "" ? "" : Number(t.value));
    if(c === "pu" && brouillon.saisieTTC){
      /* Le nombre tapé est le prix que le client paie. On garde le P.U. en HT. */
      l.ttc = l.pu;
      l.pu = (l.ttc === "" ? "" : htDepuisTTC(l.ttc, tauxTva(brouillon)));
    }
    if(c === "d"){
      var a = Store.tout("articles").filter(function(x){ return x.d === t.value; })[0];
      var champPu = document.querySelector('[data-l="' + i + '"][data-c="pu"]');
      if(a && champPu && !Number(l.pu)){
        l.pu = a.pu;
        if(brouillon.saisieTTC) l.ttc = ttcDepuisHT(a.pu, tauxTva(brouillon));
        champPu.value = puAffiche(brouillon, l);
      }
      if(a && a.code && !String(l.code || "").trim()){
        l.code = a.code;
        var champRef = document.querySelector('[data-l="' + i + '"][data-c="code"]');
        if(champRef) champRef.value = a.code;
      }
    }
    majSommes();
    return;
  }
  if(t.dataset.client){ brouillon.client[t.dataset.client] = t.value; majApercu(); return; }
  if(t.dataset.cert){
    if(!brouillon.cert) brouillon.cert = {};
    brouillon.cert[t.dataset.cert] = t.value;
    majApercu(); return;
  }

  var ch = t.dataset.champ;
  if(ch){
    if(ch === "clientId"){
      brouillon.clientId = t.value;
      var x = Store.un("clients", t.value);
      if(x){
        brouillon.client = {nom:x.nom||"", adresse:x.adresse||"", ifu:x.ifu||"", tel:x.tel||""};
        rendre(true); return;
      }
    } else if(ch === "aib"){
      /* le libellé de la ligne AIB porte le taux : il faut reconstruire le bloc */
      brouillon.aib = t.value; rendre(true); return;
    } else if(ch === "remise" || ch === "regle"){
      brouillon[ch] = Number(t.value) || 0; majSommes(); return;
    } else brouillon[ch] = t.value;
    majApercu();
  }
});

document.addEventListener("change", function(e){
  if(e.target.id === "f-type"){ filtre.type = e.target.value; rendre(true); return; }
  if(e.target.id === "f-statut"){ filtre.statut = e.target.value; rendre(true); return; }
  if(e.target.id === "c-source"){ filtreCat.source = e.target.value; rendre(true); return; }
  if(e.target.id === "c-famille"){ filtreCat.famille = e.target.value; rendre(true); return; }
  if(e.target.id === "import"){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var lecteur = new FileReader();
    lecteur.onload = function(){
      try {
        var p = JSON.parse(lecteur.result);
        COLS.forEach(function(col){
          if(Array.isArray(p[col])) p[col].forEach(function(o){ Store.poser(col, o); });
        });
        signal("Sauvegarde importée");
      } catch(err){ signal("Fichier illisible"); }
    };
    lecteur.readAsText(f);
  }
});

window.addEventListener("resize", function(){ if(vue === "editeur") majApercu(); });

demarrer();
</script>
